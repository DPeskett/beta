<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container" aria-labelledby="register-heading">
    <h2 id="register-heading">Create Account</h2>
    <form id="registerForm" novalidate>
      <label for="user_name">Full name</label>
      <input type="text" id="user_name" name="user_name" required />

      <label for="email">Email</label>
      <input type="email" id="email" nam="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required />

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone" />

      <button id="registerButton" type="submit">Register</button>
      <div id="formMessage" role="status" aria-live="polite"></div>
    </form>
    <div class="register-link">
      <p>Already have an account? <a href="index.html">Login here</a></p>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>

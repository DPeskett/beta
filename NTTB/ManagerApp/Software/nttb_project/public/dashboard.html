<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — Tasks</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="container" id="mainContainer">
    <h2 id="pageTitle">Tasks</h2>
    <div id="userInfo" style="margin-bottom:12px;">
      <span id="username">User</span> — <span id="rank"></span>
      <div style="display: flex; gap: 8px;">
        <button id="allTasksBtn" style="display: none;">All Tasks</button>
        <button id="imageViewerBtn">Image Viewer</button>
      </div>
    </div>
    <div id="welcomeMessage" role="status" aria-live="polite"></div>

    <!-- Manager: add task -->
    <div id="addTaskWrap" style="display:none; margin-bottom:16px;">
      <h3>Add Task</h3>
      <form id="addTaskForm">
        <label>Title
          <input id="taskTitle" name="title" required />
        </label>
        <label>Description</label>
        <textarea id="taskDesc" name="description" rows="10" cols="50"></textarea>
        <label>Due by
          <input id="taskDue" name="due_by" type="datetime-local" />
        </label>
        <label>Priority Level 1(Low)-4(High)
          <input id="priority" name="priority" type="number" min="0" max="5" value="0" />
        </label>
        <button id="addTaskBtn" type="submit">Add Task</button>
      </form>
    </div>
    <div id="formMessage" role="status" aria-live="polite" style="margin-top:8px;" tabindex="-1"></div>

    <!-- Tasks list -->
    <div id="tasksWrap">
      <h3>Open Tasks</h3>
      <div id="taskList"></div>
    </div>

    <!-- Admin: users table -->
    <div id="adminUsersWrap" style="display:none; margin-top:24px;">
      <h3>Manage Moderators & Managers</h3>

      <table id="usersTable" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rank</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="userList" style="margin-top:12px;"></div>

    <div style="margin-top:18px;">
      <button id="logoutBtn">Logout</button>
    </div>

  </div>

  <script src="js/authClient.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
